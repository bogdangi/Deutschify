<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle inner border ring -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#334155" stroke-width="3" opacity="0.6" />

  <!-- Tricolor Accent bar (Black / Red / Gold minimal pill) -->
  <g transform="translate(196, 76)">
    <rect x="0" y="0" width="40" height="10" rx="5" fill="#334155" />
    <rect x="44" y="0" width="40" height="10" rx="5" fill="url(#redGrad)" />
    <rect x="88" y="0" width="40" height="10" rx="5" fill="url(#accentGrad)" />
  </g>

  <!-- Central "D" letterform + Fill-the-gap symbol -->
  <g filter="url(#shadow)">
    <!-- Base stylized D -->
    <path d="M160 130 C160 130, 260 130, 310 170 C360 210, 360 302, 310 342 C260 382, 160 382, 160 382 Z" 
          fill="none" stroke="url(#primaryGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M160 130 L160 382" stroke="url(#primaryGrad)" stroke-width="36" stroke-linecap="round" />
    
    <!-- Gap marker (symbolic missing word bracket & pulse) -->
    <g transform="translate(210, 230)">
      <rect x="0" y="8" width="80" height="36" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="4" stroke-dasharray="6,4" />
      <!-- Small checkmark / spark inside gap -->
      <path d="M26 26 L36 34 L54 18" fill="none" stroke="url(#accentGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Subtitle badge: DEUTSCH -->
  <text x="256" y="445" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" letter-spacing="8">DEUTSCHIFY</text>
</svg>
